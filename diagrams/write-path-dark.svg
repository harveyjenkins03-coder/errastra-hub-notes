<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The one path every action takes</title><desc id="d">Nine steps from a button to the audit log, with the refusal taken at each check.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#262c34"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e09f3e"/></marker></defs><rect x="1" y="1" width="958" height="738" rx="12" fill="#181b20" stroke="#323a44" stroke-width="1.5"/><rect x="1" y="1" width="958" height="738" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#ece4d6" text-anchor="start">The one path every action takes</text><text x="32" y="68" font-size="14" font-weight="400" fill="#a7afb8" text-anchor="start">Each check can refuse the action; none can add to it.</text><rect x="32" y="96" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="126" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">1. A button in the page calls one named command</text><path d="M312,144 L312,164" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="164" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="194" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">2. Is the game, a gate or a benchmark running?</text><path d="M312,212 L312,232" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M592,188 L640,188" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="168" width="288" height="40" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="193" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Yes: refuse, write the refusal</text><rect x="32" y="232" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="262" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">3. Is another action still running?</text><path d="M312,280 L312,300" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M592,256 L640,256" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="236" width="288" height="40" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="261" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Yes: refuse, write the refusal</text><rect x="32" y="300" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="330" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">4. Prepare the plan from the fixed table</text><path d="M312,348 L312,368" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="368" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="398" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">5. A lasting change? Ask in a Windows dialog, No by default</text><path d="M312,416 L312,436" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M592,392 L640,392" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="368" width="288" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="388" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">No: write &quot;declined&quot;</text><text x="654" y="406" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Over 3,000 characters: refuse</text><rect x="32" y="436" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="466" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">6. After Yes: check quiet again, prepare again, compare</text><path d="M312,484 L312,504" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M592,460 L640,460" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="436" width="288" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="456" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Quiet now, or the plan changed:</text><text x="654" y="474" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">refuse, nothing runs</text><rect x="32" y="504" width="560" height="48" rx="8" fill="#2c261d" stroke="#e09f3e" stroke-width="1.5"/><text x="48" y="534" font-size="14" font-weight="600" fill="#e09f3e" text-anchor="start">7. Write &quot;started&quot; to the hash-chained audit log</text><path d="M312,552 L312,572" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><path d="M592,528 L640,528" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="508" width="288" height="40" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="533" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Cannot write it: nothing runs</text><rect x="32" y="572" width="560" height="48" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="48" y="602" font-size="14" font-weight="400" fill="#ece4d6" text-anchor="start">8. Run: full path, argument list, no shell; or one new file</text><path d="M312,620 L312,640" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="640" width="560" height="48" rx="8" fill="#2c261d" stroke="#e09f3e" stroke-width="1.5"/><text x="48" y="670" font-size="14" font-weight="600" fill="#e09f3e" text-anchor="start">9. Write the outcome to the audit log</text><text x="32" y="718" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">The two audit writes bracket the run: if &quot;started&quot; cannot be written, nothing runs.</text></svg>
