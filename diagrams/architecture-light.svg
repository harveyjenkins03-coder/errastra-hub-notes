<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How a request travels through the Hub</title><desc id="d">From the Svelte interface, through named commands, to the Rust readers and the action engine, and the folders each may touch.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#e7dece"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f95"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e6514"/></marker></defs><rect x="1" y="1" width="958" height="638" rx="12" fill="#f5efe4" stroke="#d8cdb9" stroke-width="1.5"/><rect x="1" y="1" width="958" height="638" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#1d2228" text-anchor="start">How a request travels through the Hub</text><text x="32" y="68" font-size="14" font-weight="400" fill="#55606b" text-anchor="start">Reads go left; a few also write a report into the Hub&#x27;s own folder. Actions go right.</text><rect x="32" y="92" width="896" height="88" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="46" y="116" font-size="15" font-weight="600" fill="#1d2228" text-anchor="start">Svelte 5 interface in WebView2</text><text x="46" y="137" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">CSP default-src &#x27;none&#x27;: no network, no shell, no file access; frozen prototypes</text><text x="46" y="156" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Pictures and sounds arrive as bytes for an id the core handed out (PNG and Ogg only)</text><path d="M480,180 L480,214" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><text x="494" y="202" font-size="12" font-weight="400" fill="#55606b" text-anchor="start">57 named commands over IPC; none takes a path, a URL or a command line</text><rect x="32" y="214" width="896" height="88" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="46" y="238" font-size="15" font-weight="600" fill="#1d2228" text-anchor="start">Desktop shell (Tauri 2, one capability)</text><text x="46" y="259" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">One window, destroyed on close; tray icon coloured by project state; single instance</text><text x="46" y="278" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Quiet mode while the game, a gate or a benchmark runs; native Yes/No dialog, No by default</text><path d="M240,302 L240,336" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M720,302 L720,336" fill="none" stroke="#9e6514" stroke-width="1.6" marker-end="url(#aa)"/><rect x="32" y="336" width="430" height="126" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="46" y="360" font-size="15" font-weight="600" fill="#1d2228" text-anchor="start">Readers (Rust core, tested)</text><text x="46" y="381" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Every file through one guard: registered folders,</text><text x="46" y="400" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">canonical paths, no secret-like names, size caps</text><text x="46" y="419" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">git: seven fixed questions, no lock, no monitor</text><text x="46" y="438" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Markdown cleaned in Rust; output masked for tokens</text><rect x="498" y="336" width="430" height="126" rx="8" fill="#f1e3c8" stroke="#9e6514" stroke-width="1.5"/><text x="512" y="360" font-size="15" font-weight="600" fill="#9e6514" text-anchor="start">Action engine (21 fixed plans)</text><text x="512" y="381" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">One at a time, refused while quiet</text><text x="512" y="400" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Confirmed natively, prepared again, compared</text><text x="512" y="419" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Audit line first, or nothing runs</text><text x="512" y="438" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">No shell, nothing from PATH, no file replaced</text><path d="M240,462 L240,500" fill="none" stroke="#8a8f95" stroke-width="1.6" marker-end="url(#a)"/><path d="M720,462 L720,500" fill="none" stroke="#9e6514" stroke-width="1.6" marker-end="url(#aa)"/><rect x="32" y="500" width="430" height="80" rx="8" fill="#fbf7ef" stroke="#d8cdb9" stroke-width="1"/><text x="46" y="524" font-size="15" font-weight="600" fill="#1d2228" text-anchor="start">Registered folders on local drives</text><text x="46" y="545" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">read only, opened and closed at once</text><rect x="498" y="500" width="430" height="80" rx="8" fill="#f1e3c8" stroke="#9e6514" stroke-width="1.5"/><text x="512" y="524" font-size="15" font-weight="600" fill="#9e6514" text-anchor="start">Its own folder, one new file, or a program</text><text x="512" y="545" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">a new file only in a named folder after a Yes;</text><text x="512" y="564" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">programs by full path, never through a shell</text><text x="32" y="614" font-size="13" font-weight="400" fill="#55606b" text-anchor="start">Every arrow crosses a check.</text></svg>
